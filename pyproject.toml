[project]
name = "rl-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.2.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pygame>=2.6.1",
]

[project.scripts]
rl = "cli.main:main"

[tool.setuptools]
packages = [
    "agents",
    "envs",
    "runners",
    "utils",
    "cli",
    "training"
]

